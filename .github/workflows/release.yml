name: Build and Release mapd

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build ARM64 Binary
        run: |
          mkdir -p build
          go build -ldflags="-s -w" -o build/mapd .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/mapd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
